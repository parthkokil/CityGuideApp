plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.nashik_cityguide'
    compileSdk 34

    packaging {
        resources {
            pickFirsts += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/notice.txt', 'META-INF/license.txt']
            merges += ['META-INF/services/javax.annotation.processing.Processor', 'META-INF/services/com.fasterxml.jackson.databind.Module']
        }
    }

    defaultConfig {
        applicationId "com.example.nashik_cityguide"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures{
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Firebase - using BOM for version management
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'

    // Networking
    implementation 'com.android.volley:volley:1.2.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Fragment Navigation
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.fragment:fragment:1.8.1'

    // Google Sign In
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // CircularView Image
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Picasso for image loading
    implementation 'com.squareup.picasso:picasso:2.8'

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // FirebaseUI for Firebase Realtime Database
    implementation 'com.firebaseui:firebase-ui-database:8.0.2'

    // Image Slideshow
    implementation 'com.github.denzcoskun:ImageSlideshow:0.1.2'

    // Shimmer Effect
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Custom Toast Message
    implementation 'com.github.GrenderG:Toasty:1.5.2'

    // Image Picker for Profile Photo
    implementation 'com.github.dhaval2404:imagepicker:2.1'

    // Lottie Animation
    implementation 'com.airbnb.android:lottie:6.4.1'

    // Image Slider Animation
    implementation 'com.github.AtifSayings:Animatoo:1.0.1'

    // OTP PlayStore
    implementation 'com.google.android.gms:play-services-safetynet:18.0.1'

    // OTP View
    implementation 'com.github.mukeshsolanki.android-otpview-pinview:otpview:3.1.0'

    // Password hashing bcrypt
    implementation 'org.mindrot:jbcrypt:0.4'
}